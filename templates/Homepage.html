<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMUHUB Homepage</title>
<link rel="icon" type="image/jpeg"
      href="{{ url_for('static', filename='Images/icon.png') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- MMUHUB Logo-->
    <div class="app-background">
        <div class="main-container">
            <header>
                <div class="logo">
                    <span class="red">MM</span><span class="blue">U</span><span class="green">HUB</span>
                </div>

                <!-- Navigation between for you and following page -->
                <div class="tabs">
                    <div class="tab-item active"><a href="Homepage.html">For you</a></div>
                    <div class="tab-item"><a href="Following.html">Following</a></div>
                </div>
                <hr class="header-line">
            </header>

            <!-- Navigation Bar / Sidebar -->
            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="icon-group">
                      <a href="Search.html" class="icon-circle" data-tooltip="Search"><i class="bi bi-search"></i></a>
                      <a href="Homepage.html" class="icon-circle" data-tooltip="Home"><i class="bi bi-house"></i></a>
                      <a href="Trending.html" class="icon-circle" data-tooltip="Trending"><i class="bi bi-fire"></i></a>
                      <a href="Profile.html" class="icon-circle" data-tooltip="Profile"><i class="bi bi-person"></i></a>
                      <a href="Map.html" class="icon-circle" data-tooltip="Map"><i class="bi bi-geo-alt"></i></a>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="content-area">

                    <!-- Feed Area -->
                    <section class="feed-container">
                        {% for post in posts %}
<article class="feed-post">

    <div class="feed-avatar avatar-blue">
        {{ post.username[0]|upper }}
    </div>

    <div class="feed-post-body">

        <div class="feed-post-header">
            <strong>{{ post.username }}</strong>
            <span>{{ post.time }}</span>
        </div>

        <p>{{ post.content }}</p>

        <div class="feed-actions">

    <button
        type="button"
        class="like-btn"
        data-post-id="{{ post.id }}">
        <i class="bi bi-heart"></i>
        <span class="like-count">{{ post.likes }}</span>
    </button>

    <button type="button">
        <i class="bi bi-chat"></i>
        <span>0</span>
    </button>

    {% if post.username == username %}
    <button
        type="button"
        class="delete-btn"
        data-post-id="{{ post.id }}"
        title="Delete Post">
        <i class="bi bi-trash3"></i>
    </button>
    {% endif %}

</div>

    </div>

</article>
{% endfor %}
                    </section>

                     <!-- Post Functionality -->
                    <div id="createPostBtn" class="createPostBtn" data-tooltip="New Post">
                        <i class="bi bi-plus-lg"></i>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <div id="postModalOverlay" class="modal-overlay hidden">
  <div class="post-modal">
    
    <div class="modal-header">
      <h3>New Post</h3>
      <button id="closeModalBtn" class="close-btn">&times;</button>
    </div>
    
    <div class="modal-body">
      <div class="avatar-placeholder"></div>
      <textarea placeholder="Post something..." rows="4"></textarea>
    </div>
    
    <div class="modal-footer">
      <button class="post-submit-btn">Post</button>
    </div>
    
  </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
