<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMUHUB Search Page</title>
    <link rel="icon" type="image/jpeg" href="Images/icon.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- MMUHUB Logo-->
    <div class="app-background">
        <div class="main-container">
            <header>
                <div class="logo">
                    <span class="red">MM</span><span class="blue">U</span><span class="green">HUB</span>
                </div>
                <hr class="header-line">
            </header>

            <!-- Navigation Bar / Sidebar -->
            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="icon-group">
                      <a href="Search.html" class="icon-circle" data-tooltip="Search"><i class="bi bi-search"></i></a>
                      <a href="Homepage.html" class="icon-circle" data-tooltip="Home"><i class="bi bi-house"></i></a>
                      <a href="Trending.html" class="icon-circle" data-tooltip="Trending"><i class="bi bi-fire"></i></a>
                      <a href="Profile.html" class="icon-circle" data-tooltip="Profile"><i class="bi bi-person"></i></a>
                      <a href="Map.html" class="icon-circle" data-tooltip="Map"><i class="bi bi-geo-alt"></i></a>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="content-area">
                
                    <!-- Search Area -->
                    <section class="search-container">
                        <div class="search-header">
                            <h1>Explore MMUHUB</h1>
                            <p>Find users, posts, and classes</p>
                        </div>
                        
                        <div class="search-input-wrapper">
                            <input type="text" id="searchInput" class="search-input" placeholder="Search for users, posts, or classes...">
                            <button class="search-btn" id="performSearchBtn">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                        
                        <div class="search-filters">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="posts">Posts</button>
                            <button class="filter-btn" data-filter="users">Users</button>
                            <button class="filter-btn" data-filter="classes">Classes</button>
                        </div>
                        
                        <div id="searchResults" class="search-results">
                            <!-- Search results will appear here -->
                        </div>
                    </section>
                
                </main>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
