<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMUHUB Register Page</title>

    <!-- Icon -->
    <link rel="icon"
          type="image/png"
          href="{{ url_for('static', filename='Images/icon.png') }}">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app-background">
    <div class="auth-card">

        <div class="logo" style="text-align:center;">
            <span class="red">MM</span><span class="blue">U</span><span class="green">HUB</span>
        </div>

        <h2>Register</h2>

        <form id="registerForm">

            <input
                type="text"
                id="username"
                class="auth-input"
                placeholder="Username"
                required>

            <input
                type="email"
                id="email"
                class="auth-input"
                placeholder="Email"
                required>

            <input
                type="password"
                id="password"
                class="auth-input"
                placeholder="Password"
                required>

            <button
                type="submit"
                class="auth-button">
                Register
            </button>

        </form>

        <p id="registerMessage"
           style="text-align:center; margin-top:10px;"></p>

        <p class="auth-footer">
            Already have an account?
            <a href="/login.html">Login</a>
        </p>

    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
