<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMUHUB Trending Page</title>
    <link rel="icon" type="image/png"
      href="{{ url_for('static', filename='Images/icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- MMUHUB Logo-->
    <div class="app-background">
        <div class="main-container">
            <header>
                <div class="logo">
                    <span class="red">MM</span><span class="blue">U</span><span class="green">HUB</span>
                </div>
                <hr class="header-line">
            </header>

            <!-- Navigation Bar / Sidebar -->
            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="icon-group">
                      <a href="Search.html" class="icon-circle" data-tooltip="Search"><i class="bi bi-search"></i></a>
                      <a href="Homepage.html" class="icon-circle" data-tooltip="Home"><i class="bi bi-house"></i></a>
                      <a href="Trending.html" class="icon-circle" data-tooltip="Trending"><i class="bi bi-fire"></i></a>
                      <a href="Profile.html" class="icon-circle" data-tooltip="Profile"><i class="bi bi-person"></i></a>
                      <a href="Map.html" class="icon-circle" data-tooltip="Map"><i class="bi bi-geo-alt"></i></a>
                    
                      <a href="/logout" class="icon-circle logout-btn" data-tooltip="Logout">
                           <i class="bi bi-box-arrow-right"></i>
                      </a>
                    </div>
                </aside>

                <!-- Main Content Area -->
                <main class="content-area">

                    <!-- Feed Area -->
                    <section class="feed-container">
                     <div class="feed-page-title">
                      <h1>Trending</h1>
                     </div>
{% for post in posts %}

<article class="feed-post">

    <div class="feed-avatar avatar-red">
        {{ post.username[0]|upper }}
    </div>

    <div class="feed-post-body">

        <div class="feed-post-header">
            <strong>{{ post.username }}</strong>
            <span>{{ post.time }}</span>
        </div>

        <p>{{ post.content }}</p>

        <div class="feed-actions">

    <button
        type="button"
        class="like-btn"
        data-post-id="{{ post.id }}">
        <i class="bi bi-heart"></i>
        <span class="like-count">{{ post.likes }}</span>
    </button>

    <button
        type="button"
        class="comment-btn"
        data-post-id="{{ post.id }}">
        <i class="bi bi-chat"></i>
        <span class="comment-count">{{ post.comments }}</span>
    </button>

</div>

    </div>

</article>

{% endfor %}
                    </section>  
                </main>
            </div>
        </div>
    </div>
</div>
{% include "comment_modal.html" %}
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
